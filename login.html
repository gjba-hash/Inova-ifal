<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Login · Inova IFAL</title><link rel="stylesheet" href="style.css"></head>
<body data-auth><main class="auth">
 <div class="hero-side"><i data-ic="logo"></i><h1>Inova <b>IFAL</b></h1><p>Sua voz, nossas melhores soluções.</p></div>
 <div class="form-side"><h2>Login</h2><p class="sub">Acesse sua conta para enviar suas ideias, reclamações ou correções.</p>
 <form id="form-login">
  <label class="field"><i data-ic="mail"></i><input name="email" type="email" placeholder="E-mail institucional" required autocomplete="email"></label>
  <label class="field"><i data-ic="lock"></i><input name="senha" type="password" placeholder="Senha" required autocomplete="current-password"><button type="button" class="tgl" aria-label="Mostrar senha"><i data-ic="eye"></i></button></label>
  <p class="erro" id="erro" role="alert"></p>
  <button class="btn block" type="submit">Entrar</button>
 </form>
 <p class="small">Ainda não tem uma conta? <a href="registro.html">Registre-se</a></p></div>
</main><script src="app.js"></script></body></html>
