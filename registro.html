<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Registro · Inova IFAL</title><link rel="stylesheet" href="style.css"></head>
<body data-auth><main class="auth">
 <div class="hero-side"><i data-ic="logo"></i><h1>Inova <b>IFAL</b></h1><p>Sua voz, nossas melhores soluções.</p></div>
 <div class="form-side"><h2>Registro</h2><p class="sub">Crie sua conta para participar do Inova IFAL.</p>
 <form id="form-registro">
  <label class="field"><i data-ic="user"></i><input name="nome" placeholder="Nome completo" required autocomplete="name"></label>
  <label class="field"><i data-ic="mail"></i><input name="email" type="email" placeholder="E-mail institucional" required autocomplete="email"></label>
  <label class="field"><i data-ic="lock"></i><input name="senha" type="password" placeholder="Senha (mín. 6 caracteres)" minlength="6" required autocomplete="new-password"><button type="button" class="tgl" aria-label="Mostrar senha"><i data-ic="eye"></i></button></label>
  <label class="field"><i data-ic="lock"></i><input name="confirmar" type="password" placeholder="Confirmar senha" minlength="6" required autocomplete="new-password"><button type="button" class="tgl" aria-label="Mostrar senha"><i data-ic="eye"></i></button></label>
  <label class="check"><input type="checkbox" required><span>Li e aceito os <a href="registro.html">termos de uso</a> e a <a href="registro.html">política de privacidade</a>.</span></label>
  <p class="erro" id="erro" role="alert"></p>
  <button class="btn block" type="submit">Cadastrar</button>
 </form>
 <p class="small">Já tenho uma conta? <a href="login.html">Fazer login</a></p></div>
</main><script src="app.js"></script></body></html>
